<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ada AI, Kemchuta Homes AI assistant">
  <defs>
    <linearGradient id="adaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F0C91" />
      <stop offset="100%" stop-color="#700CEB" />
    </linearGradient>
    <linearGradient id="adaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D9A0" />
      <stop offset="100%" stop-color="#C9A24B" />
    </linearGradient>
    <clipPath id="adaCircle">
      <circle cx="100" cy="100" r="100" />
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#adaBg)" />

  <g clip-path="url(#adaCircle)">
    <!-- Shoulders / top -->
    <path
      d="M34,200 C36,161 58,136 88,134 L112,134 C142,136 164,161 166,200 Z"
      fill="#F7F3EC"
    />

    <!-- Necklace -->
    <path d="M83,141 Q100,154 117,141" fill="none" stroke="url(#adaGold)" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="100" cy="152" r="2.2" fill="url(#adaGold)" />

    <!-- Neck -->
    <path d="M88,110 L112,110 L114,136 L86,136 Z" fill="#F7F3EC" />

    <!-- Head + hair, single silhouette -->
    <ellipse cx="100" cy="82" rx="36" ry="46" fill="#F7F3EC" />

    <!-- High bun -->
    <circle cx="100" cy="28" r="14" fill="#F7F3EC" />

    <!-- Center part -->
    <path d="M100,41 L100,78" fill="none" stroke="#DCCFB2" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

    <!-- Hairpin -->
    <line x1="85" y1="33" x2="97" y2="24" stroke="url(#adaGold)" stroke-width="2" stroke-linecap="round" />
    <circle cx="85" cy="33" r="1.6" fill="url(#adaGold)" />
    <circle cx="97" cy="24" r="1.6" fill="url(#adaGold)" />

    <!-- Earrings -->
    <circle cx="64" cy="96" r="2.2" fill="url(#adaGold)" />
    <circle cx="136" cy="96" r="2.2" fill="url(#adaGold)" />
  </g>

  <!-- Rim highlight -->
  <circle cx="100" cy="100" r="99" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />
</svg>
